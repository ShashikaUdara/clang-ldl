[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clang-ldl"
version = "0.5.0"
description = "Language detection from text images using CV and Unicode script analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clang_ldl*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
